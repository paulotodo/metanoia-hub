services:
  postgres:
    image: postgres:16-alpine
    container_name: metanoia-postgres-test
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metanoia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metanoia_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-metanoia_test}
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres/00-init-keycloak-schema.sql:/docker-entrypoint-initdb.d/00-init-keycloak-schema.sql
      - ./docker/postgres/init-app-role.sql:/docker-entrypoint-initdb.d/01-init-app-role.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-metanoia} -d ${POSTGRES_DB:-metanoia_test}']
      interval: 3s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: metanoia-redis-test
    ports:
      - '6380:6379'
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: metanoia-keycloak-test
    command: start-dev --import-realm
    ports:
      - '8081:8080'
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-metanoia_test}
      KC_DB_USERNAME: ${POSTGRES_USER:-metanoia}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-metanoia_dev_pass}
      KC_DB_SCHEMA: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'false'
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/8080 && echo -e "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q 200']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  minio:
    image: minio/minio:latest
    container_name: metanoia-minio-test
    command: server /data --console-address ":9001"
    ports:
      - '9002:9000'
      - '9003:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

  minio-init:
    image: minio/mc:latest
    container_name: metanoia-minio-init-test
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set myminio http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing myminio/metanoia-storage
        echo "Test bucket ready"
    depends_on:
      minio:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    container_name: metanoia-livekit-test
    command: --dev --bind 0.0.0.0
    ports:
      - '7881:7880'
    environment:
      LIVEKIT_KEYS: "devkey: secret_dev_only_not_for_production"
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:7880 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
